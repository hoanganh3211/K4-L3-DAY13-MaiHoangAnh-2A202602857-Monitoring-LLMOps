service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: Mục tiêu trải nghiệm lab là trả lời thành công trong 3 giây. Trong 28 ngày, budget = 0.005 * tổng request; consumed = total - good (lỗi hoặc chậm, không cộng trùng). 10,000 request cho phép 50 bad requests. Chỉ chốt cửa sổ sau khi request đang chạy kết thúc. Baseline local trong REPORT.md chưa đại diện tải production.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
